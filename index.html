<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ella</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fdf6f0; color: #6b4a3a; font-family: Georgia, serif; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 2.5rem; margin: 0 0 .5rem; }
  a { color: #c0607a; font-size: 1.2rem; }
</style>
<script>
  // Seule ligne à changer quand la vidéo est en ligne (lien YouTube "Non répertoriée").
  const VIDEO_URL = "";
  if (VIDEO_URL) location.replace(VIDEO_URL);
</script>
</head>
<body>
  <main>
    <h1>Ella 💛</h1>
    <p id="msg">La vidéo arrive très bientôt…</p>
  </main>
  <script>
    if (VIDEO_URL) document.getElementById("msg").innerHTML = '<a href="' + VIDEO_URL + '">Voir la vidéo</a>';
  </script>
</body>
</html>
